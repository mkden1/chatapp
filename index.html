<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cloud Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginOverlay" class="overlay">
        <div class="login-box">
            <h2>Enter Username</h2>
            <input type="text" id="usernameInput" placeholder="Username...">
            <button id="loginBtn">Join Chat</button>
        </div>
    </div>

    <div class="app-container">
        <div id="rooms" class="sidebar">
            <div id="newRoomControls" style="display: none; padding: 10px;">
                <input type="text" id="newRoomInput" placeholder="Room name...">
                <button id="confirmRoomBtn">OK</button>
                <button id="cancelRoomBtn">X</button>
            </div>
            </div>

        <div class="main-chat">
            <div id="statusText">Status: Connecting...</div>
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button id="sendBtn">Send</button>
            </div>
        </div>

        <div id="usersSidebar" class="sidebar">
            <h3>Online (<span id="userCount">0</span>)</h3>
            <div id="userList"></div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
